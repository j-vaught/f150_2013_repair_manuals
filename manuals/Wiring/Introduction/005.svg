      <text font-size="20" fill="black" x="0" y="0" transform="translate(3, 19) ">WARNINGS</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 89) ">Always wear safety glasses for eye protection.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 457) ">To avoid injury, always remove rings, watches, loose hanging jewelry</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 431) ">Do not smoke when working on a vehicle.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 472) ">and avoid wearing loose clothing.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 406) ">present in and around the battery cell. An explosion could occur.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 391) ">Do not allow flame or sparks near the battery. Gases are always</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 365) ">muffler.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 350) ">the radiator, exhaust manifold, tail pipe, catalytic converter and</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 335) ">To prevent serious burns, avoid contact with hot metal parts such as</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 309) ">engine is running.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 294) ">Keep away from moving parts, especially the fan and belts, when the</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 268) ">carbon monoxide.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 253) ">Operate the engine only in a well-ventilated area to avoid danger of</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 227) ">NEUTRAL.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 212) ">transmission should be in PARK. A manual transmission should be in</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 197) ">Set the parking brake when working on any vehicle. An automatic</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 115) ">Use safety stands whenever a procedure requires being under a</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 130) ">vehicle.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 156) ">Be sure that the IGNITION SWITCH is always in the OFF position, unless</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(67, 171) ">otherwise required by the procedure.</text>
      <text font-size="20" fill="black" x="0" y="0" transform="translate(53, 62) ">!</text>
