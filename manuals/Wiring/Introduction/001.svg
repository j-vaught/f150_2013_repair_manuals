  <g font-stretch="semi-condensed" style="fill:none" transform="translate(0, 0) scale(1.0)">
    <g style="visibility:visible" id="Sheet_1">
      <text font-size="15" fill="black" x="0" y="0" transform="translate(13, 228) ">Each circuit is shown completely and independently in one cell. Other</text>
      <text font-size="20" fill="black" x="0" y="0" transform="translate(13, 198) ">Complete Circuit Operation</text>
      <text font-size="20" fill="black" x="0" y="0" transform="translate(12, 23) ">Note</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(13, 258) ">influence the circuit operation.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(13, 243) ">components that are connected to the circuits may not be shown unless they</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 143) ">operation, wiring inside complicated components has been simplified.</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 128) ">long. Furthermore, to aid in understanding electrical (electronic)</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 113) ">treated no differently in a schematic from one that is only a few inches</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 98) ">physically appear on the vehicle. For example, a 4-foot length of wire is</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 83) ">been made on the schematics to represent components and wiring as they</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 68) ">in the vehicles. It is important to realize, however, that no attempt has</text>
      <text font-size="15" fill="black" x="0" y="0" transform="translate(12, 53) ">All wiring connections between components are shown exactly as they exist</text>
    </g>
  </g>
</svg></body></html>