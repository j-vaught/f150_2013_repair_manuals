      <g>
        <text font-size="18" fill="black" x="0" y="0" transform="translate(22, 642) ">Disconnect the ohmmeter and connect pins 2 and 3 to 12V DC power and pin 1 to ground. Measure voltage between pins 5 and 1. If the voltage is</text>
        <text font-size="18" fill="black" x="0" y="0" transform="translate(22, 678) ">the relay is okay. If not, replace the relay.</text>
        <text font-size="18" fill="black" x="0" y="0" transform="translate(22, 660) ">12V, continue with the test. If not, replace the relay. Disconnect power from pin 2 and measure voltage between pins 4 and 1. If the voltage is 12V,</text>
